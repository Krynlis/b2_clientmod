name: Build

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build --no-daemon
      - name: Read version
        id: ver
        run: echo "version=$(sed -n 's/^mod_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        with:
          name: yvelgard_clientmod
          path: '*/build/libs/yvelgard_clientmod-*.jar'

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: yvelgard_clientmod
          path: dist
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ needs.build.outputs.version }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
          else
            gh release create "$VERSION" $(find dist -name "*.jar") --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --notes "$(git log -1 --format=%b)"
          fi
