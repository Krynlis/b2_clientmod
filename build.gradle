plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
    id 'net.minecraftforge.gradle' version "${forgegradle_version}" apply false
}

subprojects {
    apply plugin: 'java'

    version = rootProject.mod_version
    group = rootProject.maven_group

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
    }

    sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
    sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = 'UTF-8'
    }

    processResources {
        def props = [version: project.version]
        inputs.properties props
        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml', 'META-INF/mods.toml', 'yvelgard_clientmod.properties']) {
            expand props
        }
    }

    tasks.named('jar') {
        archiveFileName = "yvelgard_clientmod-${project.name}-${project.version}.jar"
    }
}
